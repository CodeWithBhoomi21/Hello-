<!DOCTYPE html>
<html>
<head>
    <title>DevProject Hub</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 85%;
            margin: 25px auto;
        }

        .stats {
            display: flex;
            gap: 15px;
        }

        .box {
            background: white;
            padding: 20px;
            flex: 1;
            border-radius: 10px;
        }

        input, button {
            padding: 12px;
            margin: 6px 0;
            border-radius: 5px;
            border: 1px solid gray;
        }

        input {
            width: 90%;
        }

        button {
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .project {
            background: white;
            padding: 15px;
            margin-top: 12px;
            border-radius: 8px;
            border-left: 5px solid #2563eb;
        }

        .status {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>DevProject Hub</h1>
    <p>GitHub Project Deployment & Management</p>
</header>

<div class="container">

    <h2>My Dashboard</h2>

    <div class="stats">
        <div class="box">
            <h2 id="total">0</h2>
            <p>Total Projects</p>
        </div>

        <div class="box">
            <h2 id="live">0</h2>
            <p>Live Projects</p>
        </div>
    </div>

    <h2>Add New Project</h2>

    <input type="text" id="name"
    placeholder="Enter Project Name">

    <input type="text" id="description"
    placeholder="Enter Description">

    <input type="url" id="github"
    placeholder="Enter GitHub Repository URL">

    <button onclick="addProject()">
        Add Project
    </button>

    <h2>Search Projects</h2>

    <input type="text" id="search"
    placeholder="Search Project..."
    oninput="searchProject()">

    <h2>My Projects</h2>

    <div id="projectList"></div>

</div>

<script>

let projects = [];

function addProject() {

    let name = document.getElementById("name").value;
    let description =
    document.getElementById("description").value;

    let github = document.getElementById("github").value;

    if (name === "" || description === "" || github === "") {
        alert("Please fill all fields!");
        return;
    }

    if (!github.startsWith("https://github.com/")) {
        alert("Enter a valid GitHub repository link!");
        return;
    }

    projects.push({
        name: name,
        description: description,
        github: github
    });

    displayProjects();

    document.getElementById("name").value = "";
    document.getElementById("description").value = "";
    document.getElementById("github").value = "";
}

function displayProjects() {

    let list = document.getElementById("projectList");

    list.innerHTML = "";

    projects.forEach(function(project) {

        list.innerHTML += `
        <div class="project">
            <h3>${project.name}</h3>
            <p>${project.description}</p>

            <p class="status">Status: Added</p>

            <a href="${project.github}" target="_blank">
                View GitHub Repository
            </a>
        </div>
        `;

    });

    document.getElementById("total").innerText =
    projects.length;

    document.getElementById("live").innerText = "0";
}

function searchProject() {

    let value = document.getElementById("search")
    .value.toLowerCase();

    let items = document.querySelectorAll(".project");

    items.forEach(function(item) {

        let text = item.innerText.toLowerCase();

        item.style.display =
        text.includes(value) ? "block" : "none";

    });
}

</script>

</body>
</html>
