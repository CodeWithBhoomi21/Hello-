<!DOCTYPE html>
<html>
<head>
    <title>DevProject Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 85%;
            margin: 25px auto;
        }

        .stats {
            display: flex;
            gap: 15px;
        }

        .box {
            background: white;
            padding: 20px;
            flex: 1;
            border-radius: 10px;
        }

        input, button {
            padding: 12px;
            margin: 6px 0;
            border-radius: 5px;
            border: 1px solid gray;
        }

        input {
            width: 90%;
            max-width: 500px;
        }

        button {
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .project {
            background: white;
            padding: 15px;
            margin-top: 12px;
            border-radius: 8px;
            border-left: 5px solid #2563eb;
        }

        .status {
            color: green;
            font-weight: bold;
        }

        .delete {
            background: #dc2626;
        }

        @media(max-width:600px) {
            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>DevProject Hub</h1>
    <p>GitHub Project Deployment & Management</p>
</header>

<div class="container">

    <h2>My Dashboard</h2>

    <div class="stats">
        <div class="box">
            <h2 id="total">0</h2>
            <p>Total Projects</p>
        </div>

        <div class="box">
            <h2 id="live">0</h2>
            <p>Live Projects</p>
        </div>
    </div>

    <h2>Add New Project</h2>

    <input type="text" id="name"
    placeholder="Enter Project Name">

    <input type="text" id="description"
    placeholder="Enter Description">

    <input type="url" id="github"
    placeholder="Enter GitHub Repository URL">

    <br>

    <button id="addBtn">Add Project</button>

    <p id="message">Connecting to database...</p>

    <h2>Search Projects</h2>

    <input type="text" id="search"
    placeholder="Search Project...">

    <h2>My Projects</h2>

    <div id="projectList"></div>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    query,
    where,
    onSnapshot
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

import {
    getAuth,
    signInAnonymously
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";


// STEP 1: ADD YOUR FIREBASE CONFIG

const firebaseConfig = {
  apiKey: "AIzaSyAfsnpdA0JGk_QBvgMka52kIpwMpopsIOs",
  authDomain: "devproject-hub-6679f.firebaseapp.com",
  projectId: "devproject-hub-6679f",
  storageBucket: "devproject-hub-6679f.firebasestorage.app",
  messagingSenderId: "923886456737",
  appId: "1:923886456737:web:3562eff25a312f8da485e0",
  measurementId: "G-5YBFFPTJHJ"
};

// STEP 2: CONNECT FIREBASE

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

let currentUser = null;
let projects = [];

const nameInput = document.getElementById("name");
const descriptionInput = document.getElementById("description");
const githubInput = document.getElementById("github");
const message = document.getElementById("message");
const projectList = document.getElementById("projectList");


// STEP 3: LOGIN

try {

    const result = await signInAnonymously(auth);

    currentUser = result.user;

    message.textContent = "Database connected successfully!";

    loadProjects();

} catch (error) {

    message.textContent = "Connection error: " + error.message;

    console.error(error);

}


// STEP 4: ADD PROJECT

document.getElementById("addBtn").addEventListener("click", async function() {

    const name = nameInput.value.trim();
    const description = descriptionInput.value.trim();
    const github = githubInput.value.trim();

    if (!name || !description || !github) {
        alert("Please fill all fields!");
        return;
    }

    let url;

    try {
        url = new URL(github);
    } catch {
        alert("Enter a valid GitHub URL!");
        return;
    }

    if (url.protocol !== "https:" || url.hostname !== "github.com") {
        alert("Enter a valid GitHub repository URL!");
        return;
    }

    if (!currentUser) {
        alert("Database is not connected!");
        return;
    }

    try {

        await addDoc(collection(db, "projects"), {

            name: name,
            description: description,
            github: github,
            ownerUid: currentUser.uid,
            createdAt: Date.now()

        });

        nameInput.value = "";
        descriptionInput.value = "";
        githubInput.value = "";

        message.textContent = "Project saved successfully!";

    } catch (error) {

        alert("Error: " + error.message);

    }

});


// STEP 5: LOAD PROJECTS

function loadProjects() {

    const q = query(
        collection(db, "projects"),
        where("ownerUid", "==", currentUser.uid)
    );

    onSnapshot(q, function(snapshot) {

        projects = [];

        snapshot.forEach(function(item) {

            projects.push({
                id: item.id,
                ...item.data()
            });

        });

        displayProjects();

        message.textContent = "Database connected successfully!";

    }, function(error) {

        message.textContent = "Database error: " + error.message;

    });

}


// STEP 6: DISPLAY PROJECTS

function displayProjects() {

    const value = document.getElementById("search")
        .value.toLowerCase();

    projectList.replaceChildren();

    const filtered = projects.filter(function(project) {

        return (
            project.name.toLowerCase().includes(value) ||
            project.description.toLowerCase().includes(value)
        );

    });

    filtered.forEach(function(project) {

        const card = document.createElement("div");
        card.className = "project";

        const title = document.createElement("h3");
        title.textContent = project.name;

        const description = document.createElement("p");
        description.textContent = project.description;

        const status = document.createElement("p");
        status.className = "status";
        status.textContent = "Status: Added";

        const link = document.createElement("a");
        link.href = project.github;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "View GitHub Repository";

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", function() {
            deleteProject(project.id);
        });

        card.append(title, description, status, link, deleteButton);

        projectList.appendChild(card);

    });

    document.getElementById("total").textContent = projects.length;

    document.getElementById("live").textContent = "0";

}


// STEP 7: SEARCH PROJECTS

document.getElementById("search").addEventListener("input", function() {

    displayProjects();

});


// STEP 8: DELETE PROJECT

async function deleteProject(id) {

    if (!confirm("Are you sure you want to delete this project?")) {
        return;
    }

    try {

        await deleteDoc(doc(db, "projects", id));

        message.textContent = "Project deleted successfully!";

    } catch (error) {

        alert("Delete error: " + error.message);

    }

}

</script>

</body>
</html>
